<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloodridge champion — 32-frame attack review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171311;color:#ddd3c2;font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;padding:22px;margin:auto}h1{font-size:24px;margin:0 0 6px}p{color:#b7a186}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{background:#372316;color:inherit;border:1px solid #684b34;padding:8px 12px;font:inherit}label{display:flex;align-items:center;gap:8px}.stage{background:#201e1b;display:grid;justify-content:center;align-items:end;min-height:420px;overflow:auto;border:1px solid #4d3729;margin:18px 0;padding:16px}canvas,img{image-rendering:pixelated;image-rendering:crisp-edges}input{width:100%;accent-color:#bb4310}output{font-variant-numeric:tabular-nums}footer{display:flex;align-items:end;gap:28px;margin-top:24px}figure{margin:0}figcaption{font-size:13px;color:#b7a186}.note{font-size:14px}
</style><main>
<h1>Bloodridge champion</h1><p>New heavy attack · PixelLab PixMiniMax · 32 generated motion frames plus approved guard</p>
<div class="controls"><button id="toggle">Pause</button><button id="restart">Restart</button><label>Scale <select id="zoom"><option value="1">Native 1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label><label>Playback <select id="speed"><option value="1">Normal</option><option value="0.5">Half speed</option></select></label><output id="counter"></output></div>
<div class="stage"><canvas id="sprite" aria-label="New champion attack animation"></canvas></div>
<label>Frame <input id="frame" type="range" min="1" max="33" value="1"></label>
<footer><figure><img src="../Bloodridge-Champion-Animator-20261015/warden-reference.png" width="128" height="128" alt="Approved Bloodridge Warden"><figcaption>Approved Warden · native 1×</figcaption></figure><figure><img src="../Bloodridge-Champion-Weapon-20261015/champion-1-1x.png" width="144" height="144" alt="Approved champion guard"><figcaption>Approved champion · native 1×</figcaption></figure></footer><p class="note">Isolated motion review. Not integrated into combat.</p>
</main><script>
(async()=>{const m=await fetch('attack-sheet.json').then(r=>r.json()),fs=Array.isArray(m.frames)?m.frames:Object.values(m.frames),im=new Image();im.src='attack-sheet.png';await im.decode();const cv=document.querySelector('#sprite'),ctx=cv.getContext('2d'),slider=document.querySelector('#frame'),counter=document.querySelector('#counter'),toggle=document.querySelector('#toggle');cv.width=fs[0].sourceSize.w;cv.height=fs[0].sourceSize.h;slider.max=fs.length;let current=0,elapsed=0,playing=true,last=performance.now();function draw(){const f=fs[current],r=f.frame;ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(im,r.x,r.y,r.w,r.h,0,0,r.w,r.h);slider.value=current+1;counter.textContent=(current+1)+' / '+fs.length+' · '+f.duration+' ms'}function zoom(){const z=+document.querySelector('#zoom').value;cv.style.width=cv.width*z+'px';cv.style.height=cv.height*z+'px'}function tick(t){const dt=Math.min(t-last,100);last=t;if(playing){elapsed+=dt*+document.querySelector('#speed').value;while(elapsed>=fs[current].duration){elapsed-=fs[current].duration;current=(current+1)%fs.length;draw()}}requestAnimationFrame(tick)}toggle.onclick=()=>{playing=!playing;toggle.textContent=playing?'Pause':'Play'};document.querySelector('#restart').onclick=()=>{current=0;elapsed=0;draw()};slider.oninput=()=>{playing=false;toggle.textContent='Play';current=+slider.value-1;elapsed=0;draw()};document.querySelector('#zoom').onchange=zoom;zoom();draw();requestAnimationFrame(tick)})().catch(e=>document.querySelector('#counter').textContent=e.message);
</script></html>
