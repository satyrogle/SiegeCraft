<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloodridge champion motion review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171311;color:#ddd3c2;font:16px/1.45 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:28px}h1{font-size:25px;margin:0 0 6px}p{color:#b7a186;margin:0 0 20px}.controls{display:flex;gap:16px;align-items:center;margin:20px 0}select,button{font:inherit;background:#372316;color:#ddd3c2;border:1px solid #684b34;padding:7px 12px;cursor:pointer}.clips{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;background:#201a16;border:1px solid #4d3729;padding:16px;min-width:0}figcaption{font-size:18px;margin-bottom:12px}.stage{min-height:450px;display:grid;align-items:end;justify-items:center;overflow:auto;border-bottom:1px solid #684b34}img{image-rendering:pixelated;image-rendering:crisp-edges;display:block;max-width:none}footer{margin-top:24px;display:flex;gap:28px;align-items:center;color:#b7a186}footer .source{display:grid;justify-items:center;gap:8px;font-size:13px}@media(max-width:720px){main{padding:16px}.clips{grid-template-columns:1fr}.stage{min-height:320px}footer{flex-wrap:wrap}}
</style><main><h1>Bloodridge champion</h1><p>The selected great-khopesh champion · idle and heavy attack</p>
<div class="controls"><label>Pixel scale <select id="scale"><option value="1">Native 1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label><button id="restart">Restart both</button></div>
<div class="clips"><figure><figcaption>Idle</figcaption><div class="stage"><img id="idle" src="idle.gif" width="212" height="216" alt="Champion breathing in his approved guard"></div></figure><figure><figcaption>Heavy two-handed attack</figcaption><div class="stage"><img id="attack" src="attack.gif" width="212" height="216" alt="Champion great-khopesh attack"></div></figure></div>
<footer><div class="source"><img src="warden-reference.png" width="128" height="128" alt="Approved Bloodridge Warden">Approved Warden · native 1×</div><div class="source"><img src="approved-idle-guard.png" width="160" height="160" alt="Approved champion guard">Approved champion guard · native 1×</div><div>Motion review<br>Character design stays as selected.</div></footer></main>
<script>const clips=[document.querySelector('#idle'),document.querySelector('#attack')];function zoom(){const z=+document.querySelector('#scale').value;for(const im of clips){im.style.width=(+im.getAttribute('width')*z)+'px';im.style.height=(+im.getAttribute('height')*z)+'px'}}document.querySelector('#scale').onchange=zoom;document.querySelector('#restart').onclick=()=>{for(const im of clips){const file=im.id+'.gif';im.src=file+'?v='+Date.now()}};zoom();</script></html>
